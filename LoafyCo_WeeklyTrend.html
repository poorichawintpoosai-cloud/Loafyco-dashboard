function setMetric(m) {
  S.metric=m;
  document.getElementById('m_units').classList.toggle('on',m==='units');
  document.getElementById('m_revenue').classList.toggle('on',m==='revenue');
  build();
}
function setView(v) {
  S.view=v;
  document.getElementById('v_weekly').classList.toggle('on',v==='weekly');
  document.getElementById('v_daily').classList.toggle('on',v==='daily');
  build();
}
function toggle(key) {
  S[key]=!S[key];
  const btn=document.getElementById('t_'+key);
  btn.classList.toggle('on',S[key]);
  build();
}

function build() {
  const isWeekly = S.view==='weekly';
  const isUnits  = S.metric==='units';

  const labels  = isWeekly ? D.week_labels : D.dates;
  const barData = isWeekly
    ? (isUnits ? D.week_units  : D.week_rev)
    : (isUnits ? D.units       : D.revenue);
  const ma7Data = isWeekly
    ? (isUnits ? D.wma4_u      : D.wma4_r)   // weekly: 4-week MA
    : (isUnits ? D.ma7_u       : D.ma7_r);
  const ma14Data = isWeekly
    ? null
    : (isUnits ? D.ma14_u      : D.ma14_r);

    : (isUnits ? D.trend_u     : D.trend_r);

  const ma14Label = 'MA14';

  const avg   = total/barData.length;
  const slope = isWeekly

    : (isUnits ? D.slope_u  : D.slope_r);
  const lastW = barData[barData.length-1]||0;
  const firstW= barData[0]||0;
  const chgPct= firstW>0 ? ((lastW-firstW)/firstW*100).toFixed(1) : 0;
  const unit  = isUnits ? '' : '฿';
  const fmt   = v => isUnits ? Math.round(v).toLocaleString() : '฿'+Math.round(v).toLocaleString();

    <div class="stat"><div class="lbl">สัปดาห์ล่าสุด</div><div class="val">${fmt(lastW)}</div></div>
    <div class="stat"><div class="lbl">เทรนด์</div><div class="val ${trendColor}">${trendDir} (${slope > 0 ?'+':''}${slope}${isUnits?' units':' ฿'}/${isWeekly?'wk':'day'})</div></div>
    <div class="stat"><div class="lbl">First→Last Change</div><div class="val ${Number(chgPct)>=0?'up':'dn'}">${chgPct >= 0 ? '+' : ''}${chgPct}%</div></div>
  `;

  const datasets = [
    {
      label: isWeekly ? 'Units/Week' : 'Units/Day',
      type:'bar',
      data: barData,
      backgroundColor: '#2a9d8f55',
      borderColor: '#2a9d8f',
      borderWidth: isWeekly ? 2 : 1,
      borderRadius: isWeekly ? 6 : 2,
      order: 3,
    }
  ];

  if(S.ma7) datasets.push({
    label: ma7Label,
    type:'line',
    data: ma7Data,
    borderColor: '#06d6a0',
    backgroundColor: 'transparent',
    borderWidth: 2,
    tension: .4,
    pointRadius: isWeekly ? 4 : 0,
    pointHoverRadius: 5,
    fill: false,
    order: 2,
  });

  if(S.ma14 && ma14Data) datasets.push({
    label: ma14Label,
    type:'line',
    data: ma14Data,
    borderColor: '#c77dff',
    backgroundColor: 'transparent',
    borderWidth: 2,
    tension: .4,
    pointRadius: isWeekly ? 4 : 0,
    pointHoverRadius: 5,
    fill: false,
    order: 1,
  });

  if(S.trend) datasets.push({
    label: 'Trendline',
    type:'line',
    data: trendData,
    borderColor: '#ef476f',
    backgroundColor: 'transparent',
    borderWidth: 2,
    borderDash: [8,4],
    tension: 0,
    pointRadius: 0,
    fill: false,
    order: 0,
  });

  const yLabel = isUnits ? 'Units' : 'Revenue (฿)';
  if(ch) ch.destroy();
  ch = new Chart(document.getElementById('chart'), {
    type:'bar',
    data:{ labels, datasets },
    options:{
      responsive:true,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ position:'top' },
        tooltip:{
          callbacks:{
            label: ctx => {
              const v = ctx.parsed.y;
              if(v===null||v===undefined) return null;
              const prefix = ctx.dataset.label + ': ';
              return prefix + (isUnits ? Math.round(v).toLocaleString()+' units' : '฿'+Math.round(v).toLocaleString());
            }
          }
        }
      },
      scales:{
        x:{ grid:{ color:'#1e2240' }, ticks:{ maxRotation:45 } },
        y:{ grid:{ color:'#1e2240' }, title:{ display:true, text:yLabel } }
      }
    }
  });
}

build();
</script>
</body>
</html>
